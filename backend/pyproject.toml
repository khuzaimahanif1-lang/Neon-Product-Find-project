[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neonfind-backend"
version = "1.0.0"
description = "FastAPI product aggregation, authentication and recommendation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139.2,<1",
  "uvicorn>=0.41,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "aiosqlite>=0.22,<1",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "rapidfuzz>=3.14,<4",
  "cachetools>=6,<8",
  "pwdlib[argon2]>=0.3,<1",
  "PyJWT>=2.10,<3",
  "email-validator>=2,<3",
  "structlog>=25,<27",
  "beautifulsoup4>=4.14,<5",
  "lxml>=6,<7",
  "truststore>=0.10,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
